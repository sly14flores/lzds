services:
  # PHP Application
  lzds-system-legacy-test:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: lzds-system-legacy-test
    container_name: lzds-system-legacy-test
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    deploy:
        resources:
            limits:
                memory: 2G
            reservations:
                memory: 1G      

  # Nginx Web Server
  nginx-lzds-system-legacy-test:
    image: nginx:alpine
    container_name: nginx-lzds-system-legacy-test
    restart: unless-stopped
    ports:
      - "8084:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/conf.d/:/etc/nginx/conf.d/
    depends_on:
      - lzds-system-legacy-test
    deploy:
        resources:
            limits:
                memory: 2G
            reservations:
                memory: 1G